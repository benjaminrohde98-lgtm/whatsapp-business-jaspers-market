services:
  - type: web
    name: kumpel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node support-agent/telegram.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
